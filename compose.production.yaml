# Separate from compose.yaml (local development). Use scripts/production.sh.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: opennote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d opennote"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    image: opennote-backend:${OPENNOTE_RELEASE:?Set OPENNOTE_RELEASE}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      DJANGO_TRUST_PROXY: 'true'
      POSTGRES_HOST: db
      POSTGRES_DB: opennote
      POSTGRES_USER: opennote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging

  web:
    image: opennote-web:${OPENNOTE_RELEASE:?Set OPENNOTE_RELEASE}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

networks:
  edge:
  database:
    internal: true
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
